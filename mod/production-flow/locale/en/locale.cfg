help-balance-groups-activity-counts-under-underproducing-ok=Balance groups activity counts under Underproducing, OK and Overproducing; the individual statuses distinguish measured rates from hints. Deficit and Surplus mean measured rates differ by more than 5% of the larger rate. Low activity means both producer and consumer utilisation are below 85%; it does not prove missing inputs. Possible supply limit compares waiting consumers with producers at least 95% busy. Spare capacity is also an estimate, not a confirmed cause.
help-estimated-utilisation-compares-recorded-normal-crafts-with=Estimated utilisation compares recorded normal crafts with current crafting capacity from machine speed and recipe time. Changing machines, recipes or modules can make historical utilisation exceed 100%. Check inputs, power, transport, output space and demand before treating an alert as a diagnosis.
