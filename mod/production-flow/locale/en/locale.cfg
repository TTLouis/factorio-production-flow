balance-measured-consumption-exceeds-production-by-more-than=Measured consumption exceeds production by more than 5%. Check stored supply and transport; chest stock gives an estimated time to empty when a drain is measured.
balance-rates-roughly-balance-consumer-utilisation-is-below=Rates roughly balance, consumer utilisation is below 85% and producers are at least 95% busy. Check this item's supply and delivery before adding capacity; utilisation alone does not identify the cause.
balance-rates-roughly-balance-and-both-producer-and=Rates roughly balance and both producer and consumer utilisation are below 85%. Check inputs, transport, power and demand; low utilisation alone does not prove an upstream bottleneck.
balance-measured-production-exceeds-consumption-by-more-than=Measured production exceeds consumption by more than 5%. Output may be accumulating, exported or used outside tracked crafting machines; check recent stock trend.
balance-rates-roughly-balance-producer-utilisation-is-below=Rates roughly balance, producer utilisation is below 85% and consumers are at least 95% busy. Producer capacity may exceed current demand; check delivery and machine conditions.
balance-measured-rates-match-within-5-with-no=Measured rates match within 5%, with no utilisation warning detected. Some machines or uses may be outside the tracked data.
balance-net=Net %
balance-net-rate-divided-by-the-larger-of=Net rate divided by the larger of production and consumption. Differences within 5% count as balanced.
balance-estimated-consumer-utilisation-measured-crafts-current-crafting=Estimated consumer utilisation: measured crafts / current crafting capacity. Long periods use today's machines; values may exceed 100% after capacity changes.
