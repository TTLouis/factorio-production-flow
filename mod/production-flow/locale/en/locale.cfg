[mod-name]
production-flow=Production Flow

[mod-description]
production-flow=Live Sankey diagram of your factory's measured production flows.

[mod-setting-name]
ssk-entities-per-tick=Machines sampled per tick
ssk-window-seconds=Recent averaging window (seconds)
ssk-stock-scan-minutes=Chest stock scan interval (minutes)
ssk-auto-export-minutes=Auto-export diagnostics every N minutes (0 = off)
ssk-min-ribbon-px=Minimum ribbon thickness (px)
ssk-fluid-scale=Fluid drawing scale
ssk-debug-tabs=Show development tools

[mod-setting-description]
ssk-entities-per-tick=How many crafting machines are read each tick. Higher = fresher rates, more UPS cost.
ssk-window-seconds=Length of the Recent period option. Other selected periods, including the default 10 minutes, use their own windows.
ssk-stock-scan-minutes=Wait this many game minutes after a complete chest-stock scan before starting another. Minimum 1 minute, default 5. Longer intervals reduce average UPS cost but make stock counts and estimates less current. In-progress scans finish normally; production-rate refresh is unchanged.
ssk-auto-export-minutes=Optional local diagnostic export to script-output/production-flow/latest.json. Disabled by default; zero turns it off.
ssk-min-ribbon-px=Thin flows are drawn at least this thick so they stay visible and hoverable.
ssk-fluid-scale=Fluids run at much higher rates than items. They are drawn at this fraction of their rate (0.001 = shown in k/s). Tooltips keep real values.
ssk-debug-tabs=Adds diagnostic export, renderer comparisons, and the Graph, Sampler, Model and Render test tabs (for troubleshooting).
