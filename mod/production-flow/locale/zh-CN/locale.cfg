balance-util=利用率 %
balance-min-2=/分钟
balance-favourites=[img=ssk-star] 收藏
help-balance-groups-activity-counts-under-underproducing-ok=“收支”将活跃度计数归入“生产不足”、“正常”和“生产过剩”；具体状态会区分实测速率和排查提示。“短缺”与“盈余”表示实测速率的差异超过两者较大值的5%。“低活跃度”表示生产端和消耗端利用率均低于85%，并不能证明缺少原料。“可能供给受限”表示消耗端等待，而生产端忙碌程度至少为95%。“闲置产能”也只是估算，不能认定为故障原因。
help-estimated-utilisation-compares-recorded-normal-crafts-with=利用率估算将记录到的常规制造次数，与按机器速度和配方时间计算的当前制造能力比较。更换机器、配方或插件后，历史利用率可能超过100%。在将警报视为原因诊断前，请先检查原料、能源、运输、产物存放空间和需求。
control-toggle-the-production-flow-window=打开或关闭 Production Flow 窗口。
