balance-order=排序
balance-sort-by=按__1__排序
balance-details=详情
balance-show-net-percentage-producer-consumer-utilisation-and=显示净值百分比、生产端/消耗端利用率，以及近期库存趋势。
balance-refresh-table=刷新列表
balance-no-items-in-this-group-right-now=此分组目前没有物品。
balance-all-other-items=其他所有物品
balance-no-measured-activity-or-chest-stock-yet=尚无实测生产活动或箱内库存。请等待采样完成，然后刷新列表。
balance-no-items-match-this-view-try-everything=没有符合此视图条件的物品。请尝试“全部”或“全部分组”。
balance-show-200-more=再显示 200 行
balance-add-the-next-200-matching-rows-to=将接下来 200 行符合条件的结果加入列表
balance-formatted-2=[color=__1__]__2__：__3__[/color]
balance-no-measured-activity-in-the-current-window=当前时段内没有实测生产活动。刷新列表以重新应用筛选和排序。
help-start-here=入门
help-open-and-inspect=打开与查看
help-open-production-flow-with-its-flow-chart=点击左上角的流程图按钮打开Production Flow。“收支”用于比较所选表面上的物品和流体。点击物料名称或其放大镜，在详情区选中该物料。“流向”显示其投入和消耗端，“历史”显示所选时段内速率及箱内库存的变化。在“流向”中使用“展开投入”，可沿生产链向上游追溯。
help-periods-and-updates=时段与更新
help-choose-1m-10m-1h-10h-50h-250h=可选择1分钟、10分钟、1小时、10小时、50小时、250小时或1000小时，默认10分钟。较长的生产时段使用较粗的采样粒度，且仅统计已记录的时间。“自动更新图表”控制图表是否自动重绘。关闭后，采样和“收支”数值仍会继续更新。
help-material-selection-and-navigation=物料选择与导航
help-in-balance-and-focus-click-the-material=在“收支”和“焦点”中，点击物料槽位即可浏览或搜索物品和流体。在“收支”中，也可从列表或“流向”节点选择物料；“流向”和“历史”共用所选物料。在“焦点”中，“后退”和“前进”可回访最近查看的六种物料。“最近访问”及旁边的图标可跳转至之前的物料。后退后选择新物料会开始一条新路径。红色垃圾桶按钮可清空最近访问记录，同时保留当前物料和已采集的生产数据。齿轮按钮会在图表上方打开“图表设置”；再次点击齿轮或按Esc即可关闭。
help-a-stable-item-list=保持稳定的物品列表
help-rows-stay-in-place-while-values-change=数值更新时各行保持原位，不会打断选择。点击列表上方的“刷新列表”图标，可重新应用筛选和排序，并纳入新增、已平衡或已停止活动的物料。按“最大短缺”查找实测短缺最大的物料，或按“最先耗尽”比较估算的库存耗尽时间。没有近期生产记录的库存物品会在“全部”中显示为“仅库存”。
help-favourites=收藏
help-click-the-star-beside-a-row-s=点击某行放大镜旁的星标，可将该物品固定在“收支”列表顶部。分组星标位于“物品分组”排序下的分组标题处，或“分组”筛选器旁，可将整个分组置顶。收藏项始终显示，不受“显示”和“分组”筛选限制，不占用200行上限，并随游戏存档保存。
help-material-names-and-recipes=物料名称与配方
help-chart-nodes-use-item-and-fluid-names=图表节点使用物品和流体的名称。例如，铜板既可通过冶炼生产，也可通过浇铸生产。简单配方显示为连线，具有多种产物的配方可能单独显示为节点。
help-work-in-progress=开发中
help-balance-is-the-main-focus-of-this=本测试版主要完善“收支”视图。“焦点”、“完整桑基图”和可选的图表分组仍需进一步打磨。在尚未完成的分组视图中，“祝融星”等类别名称既不是配方名称，也不代表生产地点。
help-numbers-stock=数值与库存
help-history-warm-up=历史记录积累
help-recording-begins-when-the-mod-is-installed=安装模组后才会开始记录。“已记录”提示显示所选时段内已有多少历史数据。记录尚未积满时，速率仅按已记录的时间计算。保存和加载游戏后，已记录的历史会保留，但无法还原此前的配方生产活动。
help-made-used-and-net=生产、消耗与净值
help-made-and-used-are-measured-changes-in=“生产”和“消耗”分别为Factorio生产统计中的实测数量变化除以已记录的时长。净值＝生产－消耗。净值为正，表示该时段内生产多于消耗；为负则表示消耗更多。
help-reading-a-material-s-history=阅读物料历史
help-rate-history-shows-the-green-made-line=“速率历史”中的绿色实线表示生产，红色虚线表示总消耗。选择1小时或更长时段时，“速率历史”和“净速率”使用向前回看的移动平均值。悬停在速率时间段上，可查看时间范围和各项速率。启用“用途细分”后，会显示估算消耗量最大的三种产物，以及“其他用途”。悬停“平均消耗”可查看整个时段的明细，悬停“其他用途”可查看合并在其中的小项。“未归因消耗”表示无法唯一对应到某种产物的消耗。“净速率”为每秒生产减去消耗；绿色表示盈余，红色表示短缺。悬停库存柱可查看时间和数量。缺失采样的位置会留空，时段平均值仅使用已记录的部分。
help-selected-material-consumption=所选物料的消耗
help-the-uses-heading-names-the-selected-material=“用途”标题会注明所选物料。其下每个消耗端显示的速率都是该物料的消耗速率，而非消耗端产物的生产速率。例如，选中水时，“标准混凝土”节点显示18流体/秒，表示它每秒消耗18单位水。
help-chest-stock=箱内库存
help-stock-reads-physical-contents-of-ordinary-and=库存读取所选表面上属于玩家阵营的普通箱和物流箱内的实际物品，包括优先集货箱（蓝箱）和主动存货箱（绿箱），无需物流网络。合计所有品质，每个箱子只计一次。短横线表示暂无数据（如流体或首次扫描尚未完成），零表示实测为空。
help-sampling-and-scope=采样与统计范围
help-chest-reads-are-spread-across-ticks-only=箱内库存读取分散在多个游戏刻中。只有完整扫描结束后，才会替换上一次结果。每次扫描结束后，按“模组设置→地图”中的“箱内库存扫描间隔”等待：默认5分钟，最短1分钟。扫描规模很大时，实际间隔还会增加。“收支”显示库存采样距今的时间；生产速率仍每5秒刷新。扫描过程中在箱子之间搬运物品可能影响样本。不包括玩家和载具背包、机器内部缓存、传送带、地面物品、关联箱、无限箱和储液罐。
help-stock-changes-and-empty-time=库存变化与耗尽时间
help-stock-trend-uses-up-to-seven-completed=库存趋势使用最近最多七次完整扫描，与生产时段分别统计。默认扫描间隔下约覆盖30分钟，最短间隔下约6分钟，大型扫描会更长。估算耗尽时间用库存除以近期净减少速率；若尚未测得近期库存减少，则使用生产短缺。估算假设当前消耗趋势持续。箱内实际数量不会扣除机器人已预订取走的物品，也不会因此出现负的可用库存。
help-chest-stock-in-history=历史中的箱内库存
help-light-blue-bars-show-completed-chest-scans=浅蓝色柱表示完整扫描得到的箱内实际库存。深蓝色柱依据已记录的净速率估算库存，并在有新速率数据时每5个游戏秒更新。下一次扫描会以实测库存校正这些估算。三个图表共用同一时间轴。箱内扫描仅统计物品。
help-alerts-charts=警报与图表
help-material-watches=物料监控
help-star-a-material-or-its-group-and=先收藏物料或其分组，再在“收支”中选中该物料。在“流向”中点击警告图标，可为所选表面设置物料监控。可设置最低生产速率、箱内库存最短预计耗尽时间，或同时设置两者。流体只支持生产速率监控。物料及其分组都取消收藏后，已保存的监控会暂停。“收支”打开时，每5个游戏秒检查一次。连续两次检查低于阈值且相隔至少5秒后，列表行会显示警告；数值恢复后警告消失。检查会等待所选时段积满，并使用最近一次完整箱内扫描来判断库存。实测为空的库存按0分钟计算。监控为玩家个人设置，仅在自己的“收支”中显示警告。
help-machine-status=机器状态
help-use-the-map-icon-in-focus-or=在“焦点”或“收支”的“流向”详情区，使用地图图标查看生产或消耗所选物料的机器。从状态行打开机器预览后，可用“缩放”滑块调整相机。点击预览中的跳转箭头，会关闭Production Flow，并在远程视图中定位该机器。
help-alerts-are-hints=警报仅供排查参考
help-utilisation=利用率
help-links-versus-totals=连线与总量
help-recipe-links-are-estimated-from-completed-crafts=配方连线依据完成的制造次数、原料、产能加成和预期产量估算，因此可能与生产统计的总量不同。灰色端部表示图中连线之外的来源或用途，例如采矿、燃料、研究中心或已被筛选的活动。
help-widths-colors-and-navigation=宽度、颜色与导航
help-compressed-widths-use-a-square-root-scale=“压缩”宽度使用平方根比例，“按比例”使用基于速率的宽度。流体使用独立的绘图比例，细流带会保留最小宽度。不同物料的宽度按各自显示的单位计算。颜色可按去向或来源区分。悬停流带可查看物料和配方速率；悬停节点可高亮相关连线。点击可查看或选择，按住Shift点击可固定“收支”中的生产链高亮。使用“适配”和“居中”调整视野，密集图表仍可滚动。
help-scope=范围
help-balance-focus-and-full-sankey-each-cover=“收支”、“焦点”和“完整桑基图”各自只统计一个表面。“货运”显示表面之间已送达的货物。生产图表显示配方之间的关系。
help-transfers=货运
help-flow=流向
help-select-a-space-platform-to-see-where=选择太空平台，可查看其装货与卸货地点。流带宽度按已送达货物的重量计算。各表面按数量列出最多五种物料。悬停表面可查看完整清单，悬停流带可查看各物料的货量与平均速率。“平台生产”单独显示平台上的生产记录。
help-history=历史
help-the-upper-lane-shows-pods-delivered-to=上方轨道表示送达平台的货舱，下方轨道表示送达其他表面的货舱。选择物料可按其物品数量绘图。悬停任一轨道，可查看各物品的货量与速率。点击时间段可筛选送货记录，展开货舱可查看其内容。
help-recording-limits=记录限制
help-transfers-retains-observed-deliveries-for-up-to=“货运”保留最近最多1000个游戏小时内观测到的送货记录，所有平台合计最多32,768次。成功着陆时已确认散落的货物也计为送达。丢失的货舱及未能确认的货物不计入。
help-production-flow-help=Production Flow帮助
help-close=关闭
history-lab-use-is-estimated-from-measured-science=研究中心消耗量由科技包的实测消耗扣除配方消耗后估算，可能包含变质或其他未跟踪的消耗。
history-g=__1__G
history-no-material-selected=未选择物料
history-labs-estimated=研究中心（估算）
history-estimated-usage-breakdown=\n\n估算用途细分
history-estimated-usage-by-product=\n\n按产物估算消耗
history-unattributed-use=未归因消耗
history-formatted=__1__ __2__
history-start-from-0=从 0 开始
history-fix-the-bottom-of-the-made-and=将生产和消耗速率图的纵轴下限固定为 0。取消勾选后，按已记录的速率调整坐标范围。
history-usage-breakdown=用途细分
history-show-estimated-uses-alongside-the-total-used=在总消耗速率旁显示估算的各项用途。
history-rate-history=速率历史
history-where-it-goes=用途
history-average-used=平均消耗
history-net-rate=净速率
history-measured-estimated=__1__ 实测  __2__ 估算
history-estimates-use-the-recorded-made-minus-used=估算使用已记录的生产减去消耗速率，并在下一次实测扫描时校正。浅蓝色柱表示扫描完成时箱内的实际数量。
history-now=现在
history-h=-__1__小时
history-m=-__1__分
history-s=-__1__秒
history-s-ago=__1__秒前
history-m-s-ago=__1__分__2__秒前
history-h-m-s-ago=__1__小时__2__分__3__秒前
history-to-made-used-net=__1__至__2__\n生产  __3__ __4__\n消耗  __5__ __6__\n净值  __7__ __8__
history-rolling-average-over=以 __1__ 为窗口的移动平均\n__2__
history-measured-stock=实测库存
history-estimated-stock-since-last-scan=自上次扫描起估算的库存
