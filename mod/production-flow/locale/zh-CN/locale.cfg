balance-measured-consumption-exceeds-production-by-more-than=实测消耗比生产高出超过两者较大值的 5%。请检查储备供给和运输；测得库存减少时，会给出箱内库存预计耗尽时间。
balance-rates-roughly-balance-consumer-utilisation-is-below=速率大致平衡，消耗端利用率低于 85%，生产端忙碌程度至少为 95%。增加产能前，请先检查此物品的供给和运输；仅凭利用率无法确定原因。
balance-rates-roughly-balance-and-both-producer-and=速率大致平衡，生产端和消耗端利用率均低于 85%。请检查原料、运输、能源和需求；仅有低利用率并不能证明上游存在瓶颈。
balance-measured-production-exceeds-consumption-by-more-than=实测生产比消耗高出超过两者较大值的 5%。产物可能正在积累、被运往其他地方，或在未跟踪的制造机器之外使用；请检查近期库存趋势。
balance-rates-roughly-balance-producer-utilisation-is-below=速率大致平衡，生产端利用率低于 85%，消耗端忙碌程度至少为 95%。生产能力可能超过当前需求；请检查运输和机器状态。
balance-measured-rates-match-within-5-with-no=实测速率的差异在 5% 以内，且未发现利用率警告。部分机器或用途可能不在跟踪范围内。
balance-net=净值 %
balance-net-rate-divided-by-the-larger-of=净速率除以生产与消耗中的较大值。差异在 5% 以内视为平衡。
balance-estimated-consumer-utilisation-measured-crafts-current-crafting=消耗端利用率估算：实测制造次数÷当前制造能力。较长时段使用当前机器配置；产能发生变化后，数值可能超过 100%。
