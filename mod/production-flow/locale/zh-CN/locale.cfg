balance-status=状态
balance-produced=生产
balance-measured-production-per-second-on-the-selected=所选表面上每秒的实测生产量。
balance-consumed=消耗
balance-measured-consumption-per-second-on-the-selected=所选表面上每秒的实测消耗量。
balance-net-s=净值/秒
balance-production-minus-consumption-per-second-positive-surplus=每秒生产量减去消耗量。正值表示盈余，负值表示短缺。
balance-stock=库存
balance-physical-contents-of-ordinary-and-logistic-chests=此表面上普通箱和物流箱内的实际物品总数，包括优先集货箱（蓝箱）和主动存货箱（绿箱），并合计所有品质。无需物流网络。不包括传送带、机器、载具、玩家背包和储液罐。“—”表示暂无数据；0 表示实测为空。
balance-empty-in=耗尽时间
balance-estimated-time-until-chest-stock-is-empty=假设当前消耗趋势持续，估算箱内库存耗尽所需的时间。优先使用近期库存趋势，否则使用生产量与消耗量之差。
balance-producers=生产端
balance-estimated-producer-utilisation-measured-crafts-current-crafting=生产端利用率估算：实测制造次数÷当前制造能力。这并不能直接说明机器闲置的原因。
balance-consumers=消耗端
balance-stock-min=库存/分钟
balance-recent-change-in-chest-stock-per-minute=根据最近最多七次完整扫描，计算箱内库存每分钟的变化。统计跨度由模组设置中的库存扫描间隔决定（默认间隔 5 分钟时约为 30 分钟，大型扫描会更长），与生产速率的平均时段无关。
balance-formatted=[color=__1__]__2__[/color]
