balance-underproducing=生产不足
balance-deficits-and-activity-warnings-a-supply-warning=短缺与活跃度警告。供给警告或低活跃度需要进一步排查，并不能证明生产能力不足。
balance-no-detected-rate-or-utilisation-warning-source=未发现速率或利用率警告。外部来源/去向及仅有库存的物料不评估机器活跃度。
balance-overproducing=生产过剩
balance-measured-surplus-or-spare-producer-capacity-spare=实测盈余或生产端的闲置产能。仅有闲置产能并不意味着库存正在积累。
balance-show=显示
balance-show-2=显示__1__
balance-group=分组
