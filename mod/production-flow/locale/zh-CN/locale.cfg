[mod-name]
production-flow=Production Flow

[mod-description]
production-flow=以实时桑基图展示工厂实测的生产流向。

[mod-setting-name]
ssk-entities-per-tick=每刻采样机器数
ssk-window-seconds=备用平均时段（秒）
ssk-stock-scan-minutes=箱内库存扫描间隔（分钟）
ssk-min-ribbon-px=流带最小宽度（像素）
ssk-fluid-scale=流体绘图比例

[mod-setting-description]
ssk-entities-per-tick=每个游戏刻读取的制造机器数量。数值越高，速率越及时，但对 UPS 的开销也越大。
ssk-window-seconds=未指定平均时段时使用此设置。游戏内的“时段”选择器使用固定时长。
ssk-stock-scan-minutes=每次完整扫描箱内库存后，等待指定的游戏分钟数再开始下一次扫描。最短 1 分钟，默认 5 分钟。间隔越长，平均 UPS 开销越低，但库存数量和估算值也越滞后。正在进行的扫描会正常完成，生产速率的刷新不受影响。
ssk-min-ribbon-px=较细的流带至少按此宽度绘制，以保持可见并便于悬停查看。
ssk-fluid-scale=流体的流量通常远高于物品。绘图时将其速率乘以此比例（0.001 表示按千单位/秒显示）。提示仍显示实际数值。

