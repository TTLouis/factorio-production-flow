history-estimates-use-the-recorded-made-minus-used=估算以最近一次實物掃描為基準，累加已記錄產量減去消耗量。確認接收增加庫存，發出扣減庫存，各計一次。下一次實物掃描重設基準；未確認的收貨不計入。
