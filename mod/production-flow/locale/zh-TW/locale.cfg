history-rates-per-recorded-chart-bucket=每個已記錄時間段的速率。
history-select-a-material-above-or-from-the=請在上方或「收支」列表中選擇物料。
history-collecting-production-history-rates-appear-once-sampling=正在累積生產歷史。此表面完成採樣後即可顯示速率。
history-no-recorded-production-or-consumption-for-this=所選時段內沒有此物料的生產或消耗記錄。
