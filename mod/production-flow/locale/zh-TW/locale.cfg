balance-no-measured-activity-in-the-current-window=目前時段內沒有實測生產活動。更新列表以重新應用篩選和排序。
help-start-here=入門
help-open-and-inspect=打開與查看
help-open-production-flow-with-its-flow-chart=點擊左上角的流程圖按鈕打開Production Flow。「收支」用於比較所選表面上的物品和流體。點擊物料名稱或其放大鏡，在詳情區選取該物料。「流向」顯示其投入和消耗端，「歷史」顯示所選時段內速率及箱內庫存的變化。在「流向」中使用「展開投入」，可沿生產鏈向上游追溯。
help-periods-and-updates=時段與更新
help-choose-1m-10m-1h-10h-50h-250h=可選擇1分鐘、10分鐘、1小時、10小時、50小時、250小時或1000小時，預設10分鐘。較長的生產時段使用較粗的採樣粒度，且僅統計已記錄的時間。「自動更新圖表」控制圖表是否自動重繪。關閉後，採樣和「收支」數值仍會繼續更新。
help-material-selection-and-navigation=物料選擇與導航
help-in-balance-and-focus-click-the-material=在「收支」和「焦點」中，點擊物料槽位即可瀏覽或搜尋物品和流體。在「收支」中，也可從列表或「流向」節點選擇物料；「流向」和「歷史」共用所選物料。在「焦點」中，「後退」和「前進」可回訪最近查看的六種物料。「最近瀏覽」及旁邊的圖示可跳轉至之前的物料。後退後點擊圖表中的新物料節點會開始一條新路徑。直接從「焦點」物料選擇器選擇物料會建立新的根節點並清空後退和前進記錄，即使選擇同一物料也一樣。紅色垃圾桶按鈕會清除所選根節點和最近瀏覽記錄，同時保留已收集的生產資料和圖表設定。齒輪按鈕會在圖表上方打開「圖表設定」；再次點擊齒輪或按Esc即可關閉。
help-a-stable-item-list=保持穩定的物品列表
help-rows-stay-in-place-while-values-change=數值更新時各行保持原位，不會打斷選擇。點擊列表上方的「更新列表」圖示，可重新應用篩選和排序，並納入新增、已平衡或已停止活動的物料。按「最大短缺」尋找實測短缺最大的物料，或按「最先耗盡」比較估算的庫存耗盡時間。沒有近期生產記錄的庫存物品會在「全部」中顯示為「僅庫存」。
help-favourites=收藏
help-click-the-star-beside-a-row-s=點擊某行放大鏡旁的星標，可將該物品固定在「收支」列表頂部。分組星標位於「物品分組」排序下的分組標題處，或「分組」篩選器旁，可將整個分組置頂。收藏項始終顯示，不受「顯示」和「分組」篩選限制，不佔用200行上限，並隨遊戲存檔儲存。
help-material-names-and-recipes=物料名稱與配方
help-chart-nodes-use-item-and-fluid-names=圖表節點使用物品和流體的名稱。例如，銅板既可通過冶煉生產，也可通過澆鑄生產。簡單配方顯示為連線，具有多種產物的配方可能單獨顯示為節點。
help-work-in-progress=開發中
help-balance-is-the-main-focus-of-this=本測試版主要完善「收支」視圖。「焦點」、「完整桑基圖」和可選的圖表分組仍需進一步打磨。在尚未完成的分組視圖中，「武卡努斯星」等類別名稱既不是配方名稱，也不代表生產地點。
help-numbers-stock=數值與庫存
help-history-warm-up=歷史記錄累積
help-recording-begins-when-the-mod-is-installed=安裝模組後才會開始記錄。「已記錄」提示顯示所選時段內已有多少歷史資料。記錄尚未積滿時，速率僅按已記錄的時間計算。儲存和載入遊戲後，已記錄的歷史會保留，但無法還原此前的配方生產活動。
help-made-used-and-net=生產、消耗與淨值
help-made-and-used-are-measured-changes-in=「生產」和「消耗」分別為Factorio生產統計中的實測數量變化除以已記錄的時長。淨值＝生產－消耗。淨值為正，表示該時段內生產多於消耗；為負則表示消耗更多。
help-reading-a-material-s-history=閱讀物料歷史
help-rate-history-shows-the-green-made-line=「速率歷史」中的綠色實線表示生產，紅色虛線表示總消耗。選擇1小時或更長時段時，「速率歷史」和「淨速率」使用向前回看的移動平均值。懸停在速率時間段上，可查看時間範圍和各項速率。啟用「用途細分」後，會顯示估算消耗量最大的三種產物，以及「其他用途」。懸停「平均消耗」可查看整個時段的明細，懸停「其他用途」可查看合併在其中的小項。「未歸因消耗」表示無法唯一對應到某種產物的消耗。「淨速率」為每秒生產減去消耗；綠色表示盈餘，紅色表示短缺。懸停庫存柱可查看時間和數量。缺失採樣的位置會留空，時段平均值僅使用已記錄的部分。
help-selected-material-consumption=所選物料的消耗
help-the-uses-heading-names-the-selected-material=「用途」標題會注明所選物料。其下每個消耗端顯示的速率都是該物料的消耗速率，而非消耗端產物的生產速率。例如，選取水時，「混凝土」節點顯示18流體/秒，表示它每秒消耗18單位水。
help-chest-stock=箱內庫存
help-stock-reads-physical-contents-of-ordinary-and=庫存讀取所選表面玩家陣營的普通箱、物流箱、落地貨艙、貨運著陸平台、太空平台樞紐及已裝載火箭貨艙及平台艙口待發貨物的實際物品。合計主貨艙及所有品質，每個實體只計一次，無需物流網路。短橫線表示暫無資料；零表示實測為空。
help-sampling-and-scope=採樣與統計範圍
help-chest-reads-are-spread-across-ticks-only=庫存讀取分散在多個遊戲刻中，只有完整掃描結束後才替換上一次結果。每次完成後按「模組設定→地圖」的庫存掃描間隔等待：預設5分鐘，最短1分鐘；大型掃描會增加實際間隔。生產速率仍每5秒更新。掃描期間搬運物品可能影響樣本。不包括玩家和載具背包、製造暫存、垃圾欄、輸送帶、地面物品、關聯箱、無限箱和儲液槽。
help-stock-changes-and-empty-time=庫存變化與耗盡時間
help-stock-trend-uses-up-to-seven-completed=庫存趨勢使用最近最多七次完整掃描，與生產時段分別統計。預設掃描間隔下約覆蓋30分鐘，最短間隔下約6分鐘，大型掃描會更長。估算耗盡時間用庫存除以近期淨減少速率；若尚未測得近期庫存減少，則使用生產短缺。估算假設目前消耗趨勢持續。箱內實際數量不會扣除機器人已預訂取走的物品，也不會因此出現負的可用庫存。
help-chest-stock-in-history=歷史中的箱內庫存
help-light-blue-bars-show-completed-chest-scans=淺藍色柱表示完整掃描得到的實際庫存。深藍色柱從上一次掃描出發，加上已記錄的生產減去消耗。已知進口實收增加庫存，出口發貨扣除庫存，且不會與生產統計重複計算。未知收貨不會被假定為已收到。每次新掃描重設基準。三個圖表共用同一時間軸，庫存掃描只統計物品。
help-alerts-charts=警報與圖表
help-material-watches=物料監控
help-star-a-material-or-its-group-and=先收藏物料或其分組，再在「收支」中選取該物料。在「流向」中點擊警告圖示，可為所選表面設定物料監控。可設定最低生產速率、箱內庫存最短預計耗盡時間，或同時設定兩者。流體只支援生產速率監控。物料及其分組都取消收藏後，已儲存的監控會暫停。「收支」打開時，每5個遊戲秒檢查一次。連續兩次檢查低於門檻值且相隔至少5秒後，列表行會顯示警告；數值恢復後警告消失。檢查會等待所選時段積滿，並使用最近一次完整箱內掃描來判斷庫存。實測為空的庫存按0分鐘計算。監控為玩家個人設定，僅在自己的「收支」中顯示警告。
help-machine-status=機器狀態
help-use-the-map-icon-in-focus-or=在「焦點」或「收支」的「流向」詳情區，使用地圖圖示查看生產或消耗所選物料的機器。從狀態行打開機器預覽後，可用「縮放」滑塊調整相機。點擊預覽中的跳轉箭頭，會關閉Production Flow，並在遠端視圖中定位該機器。
help-alerts-are-hints=警報僅供排查參考
help-utilisation=利用率
help-links-versus-totals=連線與總量
help-recipe-links-are-estimated-from-completed-crafts=配方連線依據完成的製造次數、原料、產能加成和預期產量估算，因此可能與生產統計的總量不同。灰色端部表示圖中連線之外的來源或用途，例如採礦、燃料、實驗室或已被篩選的活動。
help-widths-colors-and-navigation=寬度、顏色與導航
help-compressed-widths-use-a-square-root-scale=「壓縮」寬度使用平方根比例，「按比例」使用基於速率的寬度。流體使用獨立的繪圖比例，細流帶會保留最小寬度。不同物料的寬度按各自顯示的單位計算。顏色可按去向或來源區分。懸停流帶可查看物料和配方速率；懸停節點可高亮相關連線。點擊可查看或選擇，按住Shift點擊可固定「收支」中的生產鏈高亮。使用「適合」和「置中」調整視野，密集圖表仍可捲動。
help-scope=範圍
help-balance-focus-and-full-sankey-each-cover=「收支」、「焦點」、「生產單元」和「完整桑基圖」各自只統計一個表面。「貨運」顯示表面之間已送達的貨物。生產圖表顯示配方之間的關係。
help-cells-what=什麼是生產單元
help-cells-what-text=生產單元是一組命名的生產機器，例如一個電路板模組。「生產單元」頁將每個單元畫成一個整體：投入什麼、產出什麼，以及機器有多忙。
help-cells-create=建立和編輯
help-cells-create-text=在「生產單元」頁或「生產單元」視窗中點擊 +，然後拖曳框選組裝機、熔爐和火箭發射井。為單元命名並選擇顯示物品。「生產單元」視窗列出所有已儲存的單元：Production Flow 圖示在「生產單元」頁中開啟它，鉛筆用於編輯，垃圾桶按鈕用於刪除。機器仍留在原處。編輯時，可用名稱上方的按鈕新增、移除或重新選擇機器。
help-cells-boundary=邊界物品
help-cells-boundary-text=建立或編輯單元時，投入和產出會根據機器的配方提供建議。如果某個物品並非真正輸入或輸出，點擊它即可移除；還原按鈕可找回已移除的建議。「全部」檢視只顯示你保留的邊界物品。「全部」檢視按階段排列單元：使用其他單元產出的單元排在其後，兩者之間的物品把它們連接起來。
help-cells-rates=實測與產能
help-cells-rates-text=「實測」顯示單元內機器在所選時段內實際完成的製作，以及產能使用率。新單元從儲存時開始實測。「產能」顯示每台機器都以全速製作其配方（含產能加成）。同時屬於多個單元的機器不計入「全部」檢視，但仍顯示在各單元自己的圖表中。
help-cells-replacements=替換與缺少的機器
help-cells-replacements-text=升級成員機器或在原位置重建，機器仍屬於該單元。被移除且未重建的機器記為缺少，單元會顯示警告圖示。編輯單元可忘記缺少的機器。附近新建的機器永遠不會被自動加入。
help-cells-scope=表面
help-cells-scope-text=與「收支」、「焦點」和「完整桑基圖」一樣，「生產單元」頁顯示視窗標題列中所選的表面。單元屬於建立它的表面。在 Space Exploration 中，當單元的所有機器都移到同一個新表面（例如飛船抵達）時，單元會隨之移動。
help-transfers=貨運
help-flow=流向
help-select-a-space-platform-to-see-where=選擇太空平台，可查看其裝貨與卸貨地點。流帶寬度按已送達貨物的重量計算。各表面按數量列出最多五種物料。懸停表面可查看完整清單，懸停流帶可查看各物料的貨量與平均速率。「平台生產」單獨顯示平台上的生產記錄。
help-history=歷史
help-the-upper-lane-shows-pods-delivered-to=上方軌道表示送達平台的貨艙，下方軌道表示送達其他表面的貨艙。選擇物料可按其物品數量繪圖。懸停任一軌道，可查看各物品的貨量與速率。點擊時間段可篩選送貨記錄，展開貨艙可查看其內容。
help-recording-limits=記錄限制
help-transfers-retains-observed-deliveries-for-up-to=「貨運」保留最近最多1000個遊戲小時內觀測到的送貨記錄，所有平台合計最多32,768次。成功著陸時已確認散落的貨物也計為送達。丟失的貨艙及未能確認的貨物不計入。
help-production-flow-help=Production Flow幫助
help-close=關閉
history-lab-use-is-estimated-from-measured-science=實驗室消耗量由科技包的實測消耗扣除配方消耗後估算，可能包含變質或其他未跟蹤的消耗。
