sankey-swimlanes=泳道
sankey-routed-columns-reserve-item-headers-and-long=分列布線：為物料標題和長連線預留空間，但仍可能存在交叉。大型圖表可橫向捲動。\n泳道：將相關物品分組，支援手動排序；流帶可能重疊。
sankey-tiers-by=分層依據：
sankey-tech-era-depth=科技階段＋深度
sankey-production-depth=生產深度
sankey-overview-uses-production-depth-because-groups-span=概覽中的分組可能跨越多個科技階段，因此按生產深度分層。單個物品可按「科技階段＋深度」或「生產深度」分層。
sankey-t0=T0
sankey-range=範圍：
sankey-to=至
sankey-split-raw-inputs=拆分原始投入
