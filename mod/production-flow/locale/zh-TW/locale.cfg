history-some-buckets-have-missing-samples=部分時間段缺少採樣。
history-the-chart-leaves-gaps-where-a-time=缺少採樣的時間段會在圖中留空，時段平均值仍只使用已記錄的部分。
history-usage-outside-the-three-products-shown-on=圖中顯示的三種產物以外的消耗。
