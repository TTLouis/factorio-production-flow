balance-physical-contents-of-ordinary-and-logistic-chests=合計此表面普通箱、物流箱、落地貨艙、貨運著陸平台、太空平台樞紐及已裝載火箭貨艙及平台艙口待發貨物的實際物品，包含所有品質。每個主貨艙僅計一次，無需物流網路。不包括輸送帶、製造暫存、載具、玩家背包、垃圾欄和儲液槽。— 表示暫無資料；0 表示實測為空。
balance-empty-in=耗盡時間
balance-estimated-time-until-chest-stock-is-empty=假設目前消耗趨勢持續，估算箱內庫存耗盡所需的時間。優先使用近期庫存趨勢，否則使用生產量與消耗量之差。
