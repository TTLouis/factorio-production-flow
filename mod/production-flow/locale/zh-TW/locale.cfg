history-chest-stock-history-is-available-for-items=箱內庫存歷史僅適用於物品。儲液罐不在箱內掃描範圍內。
history-no-completed-chest-stock-scan-in-the=所選時段內沒有已完成的箱內庫存掃描。
history-latest-estimate-items-updated-from-recorded-rates=最新估算：__1__ 個（__2__）。依據已記錄的速率更新。
history-stock-estimates-appear-as-rates-are-recorded=掃描後累積速率記錄，即可顯示庫存估算。
history-dark-blue-bars-estimate-stock-from-recorded=深藍色柱依據已記錄的速率估算庫存。
history-surplus-deficit=__1____2__ 盈餘   __3__ 短缺   __4__
history-made-minus-used-per-second-green-shows=__1__每秒生產量減去消耗量。綠色表示盈餘，紅色表示短缺，零表示生產與消耗相等。
machine-status-missing-input=缺少原料
