[mod-name]
production-flow=Production Flow

[mod-description]
production-flow=以即時桑基圖展示工廠實測的生產流向。

[mod-setting-name]
ssk-entities-per-tick=每個遊戲刻取樣機器數
ssk-window-seconds=備用平均時段（秒）
ssk-stock-scan-minutes=箱內庫存掃描間隔（分鐘）
ssk-min-ribbon-px=流帶最小寬度（像素）
ssk-fluid-scale=流體繪圖比例
ssk-allow-small-window=忽略最小視窗尺寸限制
ssk-remove-night-vision-tint=移除夜視色調

[mod-setting-description]
ssk-entities-per-tick=每個遊戲刻讀取的製造機器數量。數值越高，速率越及時，但對UPS的開銷也越大。
ssk-window-seconds=未指定平均時段時使用此設定。遊戲內的「時段」選擇器使用固定時長。
ssk-stock-scan-minutes=每次完整掃描箱內庫存後，等待指定的遊戲分鐘數再開始下一次掃描。最短1分鐘，預設5分鐘。間隔越長，平均UPS開銷越低，但庫存數量和估算值的更新也越不即時。正在進行的掃描會正常完成，生產速率的更新不受影響。
ssk-min-ribbon-px=較細的流帶至少按此寬度繪製，以保持可見並便於懸停查看。
ssk-fluid-scale=流體的流量通常遠高於物品。繪圖時將其速率乘以此比例（0.001表示按千單位/秒顯示）。提示仍顯示實際數值。
ssk-allow-small-window=允許在更小的視窗中開啟 Production Flow。視窗過小時仍會保持關閉，以防止版面配置錯誤。
ssk-remove-night-vision-tint=夜視裝備啟用時，整個遊戲使用中性色彩。關閉此設定並重新啟動 Factorio 可恢復裝備的原有色彩。

