help-balance-groups-activity-counts-under-underproducing-ok=「收支」將活躍度計數歸入「生產不足」、「正常」和「生產過剩」；具體狀態會區分實測速率和排查提示。「短缺」與「盈餘」表示實測速率的差異超過兩者較大值的5%。「低活躍度」表示生產端和消耗端利用率均低於85%，並不能證明缺少原料。「可能供給受限」表示消耗端等待，而生產端忙碌程度至少為95%。「閒置產能」也只是估算，不能認定為故障原因。
