machine-status-no-machines-observed=尚未觀測到機器。
machine-status-preview-one-matching-machine=__1__。預覽一臺符合條件的機器。
machine-status-time-since-the-latest-observation-of-this-2=距此配方最近一次觀測的時間。計數彙整了不同時間采集的機器樣本。
machine-status-refresh-machine-status-counts=更新機器狀態計數
machine-status-close-machine-status=關閉機器狀態
machine-status-select-an-item-or-fluid-to-see=選擇物品或流體以查看相關機器狀態。
machine-status-first-pass-in-progress-refresh-as-more=正在進行首次採樣。採樣到更多機器後，可更新查看。
machine-status-latest-observations-across-machines-refresh-to-update=顯示各機器的最近觀測結果。更新可更新計數和採樣時間。
machine-status-no-matching-machine-is-currently-available-refresh=目前沒有符合條件的可用機器。請更新計數後重試。
machine-status-machine-preview=機器預覽
machine-status-back-to-machine-status=返回機器狀態
machine-status-zoom=縮放
machine-status-jump-to-this-machine-in-remote-view=在遠端視圖中定位此機器
material-picker-choose-an-item-or-fluid=\n選擇物品或流體
material-picker-choose-an-item-or-fluid-2=選擇物品或流體
material-picker-item-fluid=物品/流體：
material-picker-other=其他
material-picker-no-matching-materials=沒有相符的物料
material-picker-select-item-fluid=選擇物品/流體
material-picker-search-item-and-fluid-names=搜尋物品和流體名稱
material-picker-close-material-picker=關閉物料選擇器
sankey-crafts-s=次/秒
sankey-total-flow=\n總流量  __1__ __2__
sankey-flow-by-recipe=\n\n按配方細分流量
sankey-show-labels=顯示標籤
sankey-keep-all-names-and-rates-visible-otherwise=始終顯示所有名稱和速率。否則僅在懸停圖示或條形時顯示；選取的物料會保留標籤。懸停可見標籤可查看詳細流量資訊。
sankey-auto-update-chart=自動更新圖表
sankey-redraw-this-chart-every-5-seconds-sampling=每5秒重繪此圖表。關閉後，採樣和「收支」數值仍會繼續更新。
sankey-missing-toolbar-sprite=缺少工具欄圖像：__1__
sankey-widths=寬度：
sankey-proportional=按比例
sankey-compressed=壓縮
sankey-proportional-linear-rate-widths-compressed-square-root=按比例：寬度與速率成正比。壓縮：使用平方根比例，讓較小流量仍清晰可見。流體使用獨立比例，細流帶保留可見的最小寬度。懸停可查看準確速率。
sankey-colors=顏色：
sankey-destination=按去向
sankey-source=按來源
sankey-destination-ribbons-feeding-the-same-node-share=按去向：流入同一節點的流帶使用該節點的顏色。按來源：流帶使用來源物料的顏色。流帶始終使用來源物料的單位。
sankey-lines=線型：
sankey-curves=曲線
sankey-right-angles=直角
sankey-right-angles-steep-ribbons-run-vertically-and=直角：陡峭的流帶垂直布線，並與其他流帶以90° 交叉。
sankey-zoom-out=縮小
sankey-fit=適合
sankey-fit-the-chart-to-the-window-while=將圖表調整至視窗大小，同時保持圖示和文字可讀；密集圖表仍可捲動。
sankey-zoom-in=放大
sankey-center=置中
sankey-center-the-selected-item-or-the-whole=將所選物品置中；未選取物品時，將整個圖表置中。
sankey-reflow=重排
sankey-recalculate-node-order-and-spacing-auto-update=重新計算節點順序和間距。否則，自動更新會保留目前布局。
sankey-chart-settings=圖表設定
sankey-chart-settings-widths-colors-lines-layout-and=圖表設定：寬度、顏色、線型、布局和自動更新。按Esc關閉。
sankey-close-chart-settings-esc=關閉圖表設定（Esc）
sankey-inputs=投入：
sankey-fewer-inputs=收起投入
sankey-hide-the-furthest-upstream-step=隱藏最遠的一層上游步驟
sankey-expand-inputs=展開投入
sankey-reveal-another-upstream-production-step-up-to=再顯示一層上游生產步驟（最多6層）
sankey-steps=層數：
sankey-item-steps-to-include-upstream-and-downstream=納入圖表的上游和下游物料層數
sankey-layout=布局：
